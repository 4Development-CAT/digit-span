<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数唱トレーニング</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                   Arial, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
    }

    .setting {
      margin: 18px 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select, button, input {
      box-sizing: border-box;
      font-size: 20px;
      padding: 10px;
    }

    select {
      min-width: 150px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      min-height: 50px;
    }

    #answerArea,
    #nextArea,
    #sessionResult {
      display: none;
      margin-top: 25px;
    }

    #answer {
      width: 100%;
      font-size: 28px;
      letter-spacing: 3px;
    }

    #status {
      margin: 25px 0 10px;
      font-size: 20px;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      line-height: 1.7;
    }

    #sessionResult {
      border-top: 1px solid #aaa;
      padding-top: 20px;
      font-size: 20px;
      line-height: 1.8;
    }

    .correct,
    .wrong {
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>数唱トレーニング</h1>

<div id="settings">

  <div class="setting">
    <label for="progressMode">桁数モード</label>
    <select id="progressMode">
      <option value="fixed">桁固定</option>
      <option value="auto">自動桁上げ</option>
    </select>
  </div>

  <div class="setting">
    <label for="digits">開始桁数</label>
    <select id="digits">
      <option>3</option>
      <option>4</option>
      <option>5</option>
      <option>6</option>
      <option selected>7</option>
      <option>8</option>
      <option>9</option>
      <option>10</option>
      <option>11</option>
      <option>12</option>
      <option>13</option>
      <option>14</option>
      <option>15</option>
    </select>
  </div>

  <div class="setting">
    <label for="interval">読み上げ間隔</label>
    <select id="interval">
      <option value="500">0.5秒</option>
      <option value="750">0.75秒</option>
      <option value="1000" selected>1.0秒</option>
      <option value="1250">1.25秒</option>
      <option value="1500">1.5秒</option>
    </select>
  </div>

  <div class="setting">
    <label for="mode">回答モード</label>
    <select id="mode">
      <option value="forward">順唱</option>
      <option value="backward">逆唱</option>
    </select>
  </div>

  <div class="setting">
    <label for="maxMistakes">各桁の不正解終了回数</label>
    <select id="maxMistakes">
      <option value="1">1回</option>
      <option value="2" selected>2回</option>
      <option value="3">3回</option>
      <option value="4">4回</option>
      <option value="5">5回</option>
    </select>
  </div>

  <button id="startSessionButton">セッション開始</button>

</div>

<div id="status"></div>

<div id="answerArea">
  <label for="answer">回答</label>

  <input
    id="answer"
    type="tel"
    inputmode="numeric"
    pattern="[0-9]*"
    autocomplete="off"
  >

  <button id="checkButton">回答する</button>
</div>

<div id="result"></div>

<div id="nextArea">
  <button id="nextButton">次の問題</button>
  <button id="endButton">ここで終了</button>
</div>

<div id="sessionResult"></div>

<script>

let currentNumbers = [];
let currentDigits = 7;

let intervalMs = 1000;
let answerMode = "forward";
let progressMode = "fixed";
let maxMistakes = 2;

let results = {};
let sessionActive = false;


/* -------------------------
   音声
------------------------- */

const audioFiles = {};
let audioPrepared = false;


/* -------------------------
   0～9の音声を事前準備
------------------------- */

function preloadAudio() {

  if (audioPrepared) {
    return Promise.resolve();
  }

  const promises = [];

  for (let digit = 0; digit <= 9; digit++) {

    const audio =
      new Audio("audio/" + digit + ".wav");

    audio.preload = "auto";

    audioFiles[digit] = audio;

    const promise =
      new Promise((resolve, reject) => {

        const loaded = () => {
          cleanup();
          resolve();
        };

        const failed = () => {
          cleanup();
          reject(
            new Error(
              digit + ".wav の読み込みに失敗しました"
            )
          );
        };

        const cleanup = () => {
          audio.removeEventListener(
            "canplaythrough",
            loaded
          );

          audio.removeEventListener(
            "error",
            failed
          );
        };

        /*
          すでに再生可能な状態なら待たない
        */
        if (audio.readyState >= 4) {
          resolve();
          return;
        }

        audio.addEventListener(
          "canplaythrough",
          loaded
        );

        audio.addEventListener(
          "error",
          failed
        );

        audio.load();
      });

    promises.push(promise);
  }

  return Promise
    .all(promises)
    .then(() => {
      audioPrepared = true;
    });
}


/* -------------------------
   数列生成
------------------------- */

function generateNumbers(length) {

  const numbers = [];

  for (let i = 0; i < length; i++) {

    numbers.push(
      Math.floor(Math.random() * 10)
    );
  }

  return numbers;
}


/* -------------------------
   待機
------------------------- */

function sleep(ms) {

  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );
}


/* -------------------------
   音声再生
------------------------- */

async function playNumbers(numbers, interval) {

  for (let i = 0; i < numbers.length; i++) {

    const audio =
      audioFiles[numbers[i]];

    if (!audio) {
      throw new Error(
        "音声が準備されていません"
      );
    }

    /*
      同じ数字が連続しても
      必ず先頭から再生する
    */
    audio.pause();
    audio.currentTime = 0;

    await audio.play();

    /*
      次の数字を読み始めるまでの間隔
    */
    await sleep(interval);
  }
}


/* -------------------------
   問題開始
------------------------- */

async function startQuestion() {

  if (!sessionActive) {
    return;
  }

  document
    .getElementById("answerArea")
    .style.display = "none";

  document
    .getElementById("nextArea")
    .style.display = "none";

  document
    .getElementById("result")
    .innerHTML = "";

  document
    .getElementById("status")
    .textContent =
      currentDigits + "桁　読み上げ中...";

  currentNumbers =
    generateNumbers(currentDigits);

  try {

    await playNumbers(
      currentNumbers,
      intervalMs
    );

  } catch (error) {

    console.error(error);

    sessionActive = false;

    document
      .getElementById("status")
      .textContent =
        "音声の再生に失敗しました。";

    return;
  }

  document
    .getElementById("status")
    .textContent =
      currentDigits + "桁　回答してください";

  document
    .getElementById("answer")
    .value = "";

  document
    .getElementById("answerArea")
    .style.display = "block";

  document
    .getElementById("answer")
    .focus();
}


/* -------------------------
   セッション開始
------------------------- */

document
  .getElementById("startSessionButton")
  .addEventListener("click", async () => {

    const startButton =
      document.getElementById(
        "startSessionButton"
      );

    startButton.disabled = true;
    startButton.textContent =
      "音声を準備中...";

    document
      .getElementById("status")
      .textContent = "";

    try {

      /*
        0～9を最初に読み込む
      */
      await preloadAudio();

      currentDigits =
        Number(
          document
            .getElementById("digits")
            .value
        );

      intervalMs =
        Number(
          document
            .getElementById("interval")
            .value
        );

      answerMode =
        document
          .getElementById("mode")
          .value;

      progressMode =
        document
          .getElementById("progressMode")
          .value;

      maxMistakes =
        Number(
          document
            .getElementById("maxMistakes")
            .value
        );

      results = {};
      sessionActive = true;

      document
        .getElementById("settings")
        .style.display = "none";

      document
        .getElementById("sessionResult")
        .style.display = "none";

      await startQuestion();

    } catch (error) {

      console.error(error);

      document
        .getElementById("status")
        .textContent =
          "音声の読み込みに失敗しました。" +
          "通信状態を確認して、" +
          "もう一度開始してください。";

    } finally {

      startButton.disabled = false;

      startButton.textContent =
        "セッション開始";
    }
  });


/* -------------------------
   回答判定
------------------------- */

document
  .getElementById("checkButton")
  .addEventListener("click", () => {

    if (!sessionActive) {
      return;
    }

    const answer =
      document
        .getElementById("answer")
        .value
        .trim();

    if (answer === "") {
      return;
    }

    let correctNumbers =
      [...currentNumbers];

    if (answerMode === "backward") {
      correctNumbers.reverse();
    }

    const correct =
      correctNumbers.join("");

    if (!results[currentDigits]) {

      results[currentDigits] = {
        success: 0,
        attempts: 0,
        mistakes: 0
      };
    }

    results[currentDigits].attempts++;

    const isCorrect =
      answer === correct;

    if (isCorrect) {

      results[currentDigits].success++;

      document
        .getElementById("result")
        .innerHTML =
          '<span class="correct">' +
          "○ 正解</span>" +
          "<br>正答：" +
          correct;

    } else {

      results[currentDigits].mistakes++;

      document
        .getElementById("result")
        .innerHTML =
          '<span class="wrong">' +
          "× 不正解</span>" +
          "<br>あなたの回答：" +
          answer +
          "<br>正答：" +
          correct;
    }

    document
      .getElementById("answerArea")
      .style.display = "none";


    /*
      自動桁上げ
    */

    if (progressMode === "auto") {

      if (isCorrect) {

        if (currentDigits >= 15) {

          endSession();
          return;
        }

        currentDigits++;

        document
          .getElementById("nextArea")
          .style.display = "block";

        return;
      }

      if (
        results[currentDigits].mistakes >=
        maxMistakes
      ) {

        endSession();
        return;
      }
    }

    document
      .getElementById("nextArea")
      .style.display = "block";
  });


/* -------------------------
   次の問題
------------------------- */

document
  .getElementById("nextButton")
  .addEventListener("click", async () => {

    await startQuestion();
  });


/* -------------------------
   手動終了
------------------------- */

document
  .getElementById("endButton")
  .addEventListener("click", () => {

    endSession();
  });


/* -------------------------
   セッション終了
------------------------- */

function endSession() {

  sessionActive = false;

  document
    .getElementById("answerArea")
    .style.display = "none";

  document
    .getElementById("nextArea")
    .style.display = "none";

  document
    .getElementById("status")
    .textContent =
      "セッション終了";

  showSessionResult();
}


/* -------------------------
   結果表示
------------------------- */

function showSessionResult() {

  const resultArea =
    document.getElementById(
      "sessionResult"
    );

  let html =
    "<strong>【結果】</strong><br><br>";

  const digitList =
    Object
      .keys(results)
      .map(Number)
      .sort((a, b) => a - b);

  let highestSuccess = null;

  for (const digit of digitList) {

    const data =
      results[digit];

    html +=
      digit +
      "桁：" +
      data.success +
      " / " +
      data.attempts +
      "<br>";

    if (data.success > 0) {

      if (
        highestSuccess === null ||
        digit > highestSuccess
      ) {

        highestSuccess = digit;
      }
    }
  }

  html += "<br>";

  if (highestSuccess !== null) {

    html +=
      "<strong>最高到達桁：" +
      highestSuccess +
      "桁</strong>";

  } else {

    html +=
      "<strong>最高到達桁：なし</strong>";
  }

  html +=
    '<br><br>' +
    '<button onclick="resetSession()">' +
    "設定画面へ戻る" +
    "</button>";

  resultArea.innerHTML = html;
  resultArea.style.display = "block";
}


/* -------------------------
   設定画面へ戻る
------------------------- */

function resetSession() {

  document
    .getElementById("settings")
    .style.display = "block";

  document
    .getElementById("status")
    .textContent = "";

  document
    .getElementById("result")
    .innerHTML = "";

  document
    .getElementById("sessionResult")
    .style.display = "none";
}


/* -------------------------
   Enterキーでも回答
------------------------- */

document
  .getElementById("answer")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {

      event.preventDefault();

      document
        .getElementById("checkButton")
        .click();
    }
  });

</script>

</body>
</html>
