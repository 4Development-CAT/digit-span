<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMIトレーニング</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }
    h1 { font-size: 24px; }
    .setting { margin: 18px 0; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    select, button, input { box-sizing: border-box; font-size: 20px; padding: 10px; }
    select { min-width: 150px; }
    button { width: 100%; margin-top: 15px; min-height: 50px; }
    #answerArea, #nextArea, #sessionResult { display: none; margin-top: 25px; }
    #answer { width: 100%; font-size: 28px; letter-spacing: 3px; }
    #status { margin: 25px 0 10px; font-size: 20px; font-weight: bold; }
    #result { margin-top: 20px; font-size: 20px; line-height: 1.7; }
    #sessionResult {
      border-top: 1px solid #aaa;
      padding-top: 20px;
      font-size: 20px;
      line-height: 1.8;
    }
    .correct, .wrong { font-weight: bold; }

    #sequenceAnswerArea { display: none; }
    #sequenceAnswer {
      width: 100%;
      min-height: 52px;
      padding: 10px;
      border: 1px solid #888;
      border-radius: 6px;
      font-size: 26px;
      letter-spacing: 2px;
      background: white;
    }
    .keyTitle {
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 18px;
    }
    .keyGrid {
      display: grid;
      gap: 6px;
    }
    #numberKeys { grid-template-columns: repeat(5, 1fr); }
    #kanaKeys { grid-template-columns: repeat(5, 1fr); }
    .keyButton {
      margin: 0;
      min-height: 44px;
      padding: 6px 2px;
      font-size: 19px;
    }
    #deleteSequenceButton { margin-top: 12px; }
  </style>
</head>
<body>

<h1>WMIトレーニング</h1>

<div id="settings">
  <div class="setting">
    <label for="trainingType">トレーニング</label>
    <select id="trainingType">
      <option value="digitSpan">数唱</option>
      <option value="letterNumber">語音整列</option>
    </select>
  </div>

  <div class="setting">
    <label for="progressMode">項目数モード</label>
    <select id="progressMode">
      <option value="fixed">固定</option>
      <option value="auto">自動項目数上げ</option>
    </select>
  </div>

  <div class="setting">
    <label for="digits">開始項目数</label>
    <select id="digits">
      <option>3</option><option>4</option><option>5</option><option>6</option>
      <option selected>7</option><option>8</option><option>9</option><option>10</option>
      <option>11</option><option>12</option><option>13</option><option>14</option><option>15</option>
    </select>
  </div>

  <div class="setting">
    <label for="interval">読み上げ間隔</label>
    <select id="interval">
      <option value="500">0.5秒</option>
      <option value="750">0.75秒</option>
      <option value="1000" selected>1.0秒</option>
      <option value="1250">1.25秒</option>
      <option value="1500">1.5秒</option>
    </select>
  </div>

  <div class="setting" id="digitModeSetting">
    <label for="mode">回答モード</label>
    <select id="mode">
      <option value="forward">順唱</option>
      <option value="backward">逆唱</option>
    </select>
  </div>

  <div class="setting">
    <label for="maxMistakes">各項目数の不正解終了回数</label>
    <select id="maxMistakes">
      <option value="1">1回</option>
      <option value="2" selected>2回</option>
      <option value="3">3回</option>
      <option value="4">4回</option>
      <option value="5">5回</option>
    </select>
  </div>

  <button id="startSessionButton">セッション開始</button>
</div>

<div id="status"></div>

<div id="answerArea">
  <div id="digitAnswerArea">
    <label for="answer">回答</label>
    <input id="answer" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
  </div>

  <div id="sequenceAnswerArea">
    <label>回答</label>
    <input id="sequenceAnswer" type="text" inputmode="none" autocomplete="off" readonly>

    <div class="keyTitle">数字</div>
    <div id="numberKeys" class="keyGrid"></div>

    <div class="keyTitle">カナ</div>
    <div id="kanaKeys" class="keyGrid"></div>

    <button id="deleteSequenceButton" type="button">1文字削除</button>
  </div>

  <button id="checkButton">回答する</button>
</div>

<div id="result"></div>

<div id="nextArea">
  <button id="nextButton">次の問題</button>
  <button id="endButton">ここで終了</button>
</div>

<div id="sessionResult"></div>

<script>
let trainingType = "digitSpan";
let currentItems = [];
let currentCount = 7;
let intervalMs = 1000;
let answerMode = "forward";
let progressMode = "fixed";
let maxMistakes = 2;
let results = {};
let sessionActive = false;
let sequenceAnswerText = "";

const audioFiles = {};
const preparedAudioKeys = new Set();

const kanaList = [
  { char:"ア", file:"a.wav" },   { char:"イ", file:"i.wav" },
  { char:"ウ", file:"u.wav" },   { char:"エ", file:"e.wav" },
  { char:"オ", file:"o.wav" },
  { char:"カ", file:"ka.wav" },  { char:"キ", file:"ki.wav" },
  { char:"ク", file:"ku.wav" },  { char:"ケ", file:"ke.wav" },
  { char:"コ", file:"ko.wav" },
  { char:"サ", file:"sa.wav" },  { char:"シ", file:"si.wav" },
  { char:"ス", file:"su.wav" },  { char:"セ", file:"se.wav" },
  { char:"ソ", file:"so.wav" },
  { char:"タ", file:"ta.wav" },  { char:"チ", file:"ti.wav" },
  { char:"ツ", file:"tu.wav" }, { char:"テ", file:"te.wav" },
  { char:"ト", file:"to.wav" },
  { char:"ナ", file:"na.wav" },  { char:"ニ", file:"ni.wav" },
  { char:"ヌ", file:"nu.wav" },  { char:"ネ", file:"ne.wav" },
  { char:"ノ", file:"no.wav" },
  { char:"ハ", file:"ha.wav" },  { char:"ヒ", file:"hi.wav" },
  { char:"フ", file:"hu.wav" },  { char:"ヘ", file:"he.wav" },
  { char:"ホ", file:"ho.wav" },
  { char:"マ", file:"ma.wav" },  { char:"ミ", file:"mi.wav" },
  { char:"ム", file:"mu.wav" },  { char:"メ", file:"me.wav" },
  { char:"モ", file:"mo.wav" },
  { char:"ヤ", file:"ya.wav" },  { char:"ユ", file:"yu.wav" },
  { char:"ヨ", file:"yo.wav" },
  { char:"ラ", file:"ra.wav" },  { char:"リ", file:"ri.wav" },
  { char:"ル", file:"ru.wav" },  { char:"レ", file:"re.wav" },
  { char:"ロ", file:"ro.wav" },
  { char:"ワ", file:"wa.wav" }
];

const kanaOrder = new Map(kanaList.map((item, index) => [item.char, index]));
const kanaByChar = new Map(kanaList.map(item => [item.char, item]));

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function shuffle(array) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function loadAudio(key, fileName) {
  if (preparedAudioKeys.has(key)) return Promise.resolve();

  const audio = new Audio("audio/" + fileName);
  audio.preload = "auto";
  audioFiles[key] = audio;

  return new Promise((resolve, reject) => {
    const cleanup = () => {
      audio.removeEventListener("canplaythrough", loaded);
      audio.removeEventListener("error", failed);
    };
    const loaded = () => {
      cleanup();
      preparedAudioKeys.add(key);
      resolve();
    };
    const failed = () => {
      cleanup();
      reject(new Error(fileName + " の読み込みに失敗しました"));
    };

    if (audio.readyState >= 4) {
      preparedAudioKeys.add(key);
      resolve();
      return;
    }

    audio.addEventListener("canplaythrough", loaded);
    audio.addEventListener("error", failed);
    audio.load();
  });
}

async function preloadAudioForSession() {
  const promises = [];

  if (trainingType === "digitSpan") {
    for (let digit = 0; digit <= 9; digit++) {
      promises.push(loadAudio("d" + digit, digit + ".wav"));
    }
  } else {
    for (let digit = 1; digit <= 9; digit++) {
      promises.push(loadAudio("d" + digit, digit + ".wav"));
    }
    for (const kana of kanaList) {
      promises.push(loadAudio("k" + kana.char, kana.file));
    }
  }

  await Promise.all(promises);
}

function generateDigitSpan(length) {
  const items = [];
  for (let i = 0; i < length; i++) {
    const value = Math.floor(Math.random() * 10);
    items.push({ type:"digit", value:String(value), audioKey:"d" + value });
  }
  return items;
}

function generateLetterNumber(length) {
  // 数字とカナを最低1つずつ含める。
  // 同一問題内では同じ数字・同じカナを重複させない。
  const maxDigits = Math.min(9, length - 1);
  const minDigits = Math.max(1, length - kanaList.length);
  const digitCount =
    minDigits + Math.floor(Math.random() * (maxDigits - minDigits + 1));
  const kanaCount = length - digitCount;

  const digitPool = shuffle([1,2,3,4,5,6,7,8,9]).slice(0, digitCount);
  const kanaPool = shuffle(kanaList).slice(0, kanaCount);

  // 「2（に）」と「ニ」は音だけでは紛らわしいため、
  // 同一問題には共存させない。9は音声が「きゅう」なのでクとの共存可。
  if (digitPool.includes(2)) {
    const niIndex = kanaPool.findIndex(kana => kana.char === "ニ");
    if (niIndex !== -1) {
      const usedKana = new Set(kanaPool.map(kana => kana.char));
      const replacement = shuffle(
        kanaList.filter(kana => kana.char !== "ニ" && !usedKana.has(kana.char))
      )[0];
      kanaPool[niIndex] = replacement;
    }
  }

  const items = [
    ...digitPool.map(value => ({
      type:"digit", value:String(value), audioKey:"d" + value
    })),
    ...kanaPool.map(kana => ({
      type:"kana", value:kana.char, audioKey:"k" + kana.char
    }))
  ];

  return shuffle(items);
}

async function playItems(items, interval) {
  for (const item of items) {
    const audio = audioFiles[item.audioKey];
    if (!audio) throw new Error("音声が準備されていません: " + item.value);

    audio.pause();
    audio.currentTime = 0;
    await audio.play();
    await sleep(interval);
  }
}

function getCorrectAnswer() {
  if (trainingType === "digitSpan") {
    let values = currentItems.map(item => item.value);
    if (answerMode === "backward") values = [...values].reverse();
    return values.join("");
  }

  const digits = currentItems
    .filter(item => item.type === "digit")
    .map(item => Number(item.value))
    .sort((a, b) => a - b)
    .join("");

  const kana = currentItems
    .filter(item => item.type === "kana")
    .map(item => item.value)
    .sort((a, b) => kanaOrder.get(a) - kanaOrder.get(b))
    .join("");

  return digits + kana;
}

function getUserAnswer() {
  if (trainingType === "digitSpan") {
    return document.getElementById("answer").value.trim();
  }
  return sequenceAnswerText;
}

function clearAnswer() {
  document.getElementById("answer").value = "";
  sequenceAnswerText = "";
  updateSequenceAnswer(0);
}

function updateSequenceAnswer(caretPosition = null) {
  const area = document.getElementById("sequenceAnswer");
  area.value = sequenceAnswerText;

  const position =
    caretPosition === null ? sequenceAnswerText.length : caretPosition;

  requestAnimationFrame(() => {
    area.focus({ preventScroll: true });
    area.setSelectionRange(position, position);
  });
}

function insertSequenceValue(value) {
  const area = document.getElementById("sequenceAnswer");
  const start =
    typeof area.selectionStart === "number"
      ? area.selectionStart
      : sequenceAnswerText.length;
  const end =
    typeof area.selectionEnd === "number"
      ? area.selectionEnd
      : start;

  sequenceAnswerText =
    sequenceAnswerText.slice(0, start) +
    value +
    sequenceAnswerText.slice(end);

  updateSequenceAnswer(start + value.length);
}

function deleteSequenceValue() {
  const area = document.getElementById("sequenceAnswer");
  const start =
    typeof area.selectionStart === "number"
      ? area.selectionStart
      : sequenceAnswerText.length;
  const end =
    typeof area.selectionEnd === "number"
      ? area.selectionEnd
      : start;

  if (start !== end) {
    sequenceAnswerText =
      sequenceAnswerText.slice(0, start) +
      sequenceAnswerText.slice(end);
    updateSequenceAnswer(start);
    return;
  }

  if (start <= 0) return;

  sequenceAnswerText =
    sequenceAnswerText.slice(0, start - 1) +
    sequenceAnswerText.slice(start);

  updateSequenceAnswer(start - 1);
}

function buildAnswerKeys() {
  const numberKeys = document.getElementById("numberKeys");
  const kanaKeys = document.getElementById("kanaKeys");
  numberKeys.innerHTML = "";
  kanaKeys.innerHTML = "";

  for (let digit = 1; digit <= 9; digit++) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "keyButton";
    button.textContent = digit;
    button.addEventListener("click", () => {
      insertSequenceValue(String(digit));
    });
    numberKeys.appendChild(button);
  }

  for (const kana of kanaList) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "keyButton";
    button.textContent = kana.char;
    button.addEventListener("click", () => {
      insertSequenceValue(kana.char);
    });
    kanaKeys.appendChild(button);
  }
}

function updateSettingsForTrainingType() {
  const type = document.getElementById("trainingType").value;
  document.getElementById("digitModeSetting").style.display =
    type === "digitSpan" ? "block" : "none";
}

async function startQuestion() {
  if (!sessionActive) return;

  document.getElementById("answerArea").style.display = "none";
  document.getElementById("nextArea").style.display = "none";
  document.getElementById("result").innerHTML = "";

  const unit = trainingType === "digitSpan" ? "桁" : "項目";
  document.getElementById("status").textContent =
    currentCount + unit + "　読み上げ中...";

  currentItems =
    trainingType === "digitSpan"
      ? generateDigitSpan(currentCount)
      : generateLetterNumber(currentCount);

  try {
    await playItems(currentItems, intervalMs);
  } catch (error) {
    console.error(error);
    sessionActive = false;
    document.getElementById("status").textContent = "音声の再生に失敗しました。";
    return;
  }

  document.getElementById("status").textContent =
    currentCount + unit + "　回答してください";

  clearAnswer();

  if (trainingType === "digitSpan") {
    document.getElementById("digitAnswerArea").style.display = "block";
    document.getElementById("sequenceAnswerArea").style.display = "none";
  } else {
    document.getElementById("digitAnswerArea").style.display = "none";
    document.getElementById("sequenceAnswerArea").style.display = "block";
  }

  document.getElementById("answerArea").style.display = "block";

  if (trainingType === "digitSpan") {
    document.getElementById("answer").focus();
  }
}

document.getElementById("trainingType").addEventListener(
  "change", updateSettingsForTrainingType
);

document.getElementById("deleteSequenceButton").addEventListener("click", () => {
  deleteSequenceValue();
});

document.getElementById("startSessionButton").addEventListener("click", async () => {
  const startButton = document.getElementById("startSessionButton");
  startButton.disabled = true;
  startButton.textContent = "音声を準備中...";
  document.getElementById("status").textContent = "";

  try {
    trainingType = document.getElementById("trainingType").value;
    currentCount = Number(document.getElementById("digits").value);
    intervalMs = Number(document.getElementById("interval").value);
    answerMode = document.getElementById("mode").value;
    progressMode = document.getElementById("progressMode").value;
    maxMistakes = Number(document.getElementById("maxMistakes").value);

    await preloadAudioForSession();

    results = {};
    sessionActive = true;
    document.getElementById("settings").style.display = "none";
    document.getElementById("sessionResult").style.display = "none";
    await startQuestion();
  } catch (error) {
    console.error(error);
    document.getElementById("status").textContent =
      "音声の読み込みに失敗しました。ファイル名と通信状態を確認して、もう一度開始してください。";
  } finally {
    startButton.disabled = false;
    startButton.textContent = "セッション開始";
  }
});

document.getElementById("checkButton").addEventListener("click", () => {
  if (!sessionActive) return;

  const answer = getUserAnswer();
  if (answer === "") return;

  const correct = getCorrectAnswer();

  if (!results[currentCount]) {
    results[currentCount] = { success:0, attempts:0, mistakes:0 };
  }

  results[currentCount].attempts++;
  const isCorrect = answer === correct;

  if (isCorrect) {
    results[currentCount].success++;
    document.getElementById("result").innerHTML =
      '<span class="correct">○ 正解</span><br>正答：' + correct;
  } else {
    results[currentCount].mistakes++;
    document.getElementById("result").innerHTML =
      '<span class="wrong">× 不正解</span>' +
      "<br>あなたの回答：" + answer +
      "<br>正答：" + correct;
  }

  document.getElementById("answerArea").style.display = "none";

  if (progressMode === "auto") {
    if (isCorrect) {
      if (currentCount >= 15) {
        endSession();
        return;
      }
      currentCount++;
      document.getElementById("nextArea").style.display = "block";
      return;
    }

    if (results[currentCount].mistakes >= maxMistakes) {
      endSession();
      return;
    }
  }

  document.getElementById("nextArea").style.display = "block";
});

document.getElementById("nextButton").addEventListener("click", async () => {
  await startQuestion();
});

document.getElementById("endButton").addEventListener("click", endSession);

function endSession() {
  sessionActive = false;
  document.getElementById("answerArea").style.display = "none";
  document.getElementById("nextArea").style.display = "none";
  document.getElementById("status").textContent = "セッション終了";
  showSessionResult();
}

function showSessionResult() {
  const resultArea = document.getElementById("sessionResult");
  let html = "<strong>【結果】</strong><br><br>";

  const countList = Object.keys(results).map(Number).sort((a, b) => a - b);
  let highestSuccess = null;
  const unit = trainingType === "digitSpan" ? "桁" : "項目";

  for (const count of countList) {
    const data = results[count];
    html += count + unit + "：" + data.success + " / " + data.attempts + "<br>";
    if (data.success > 0 &&
        (highestSuccess === null || count > highestSuccess)) {
      highestSuccess = count;
    }
  }

  html += "<br>";

  if (highestSuccess !== null) {
    html += "<strong>最高到達" + unit + "：" +
      highestSuccess + unit + "</strong>";
  } else {
    html += "<strong>最高到達" + unit + "：なし</strong>";
  }

  html += '<br><br><button onclick="resetSession()">設定画面へ戻る</button>';
  resultArea.innerHTML = html;
  resultArea.style.display = "block";
}

function resetSession() {
  document.getElementById("settings").style.display = "block";
  document.getElementById("status").textContent = "";
  document.getElementById("result").innerHTML = "";
  document.getElementById("sessionResult").style.display = "none";
  updateSettingsForTrainingType();
}

document.getElementById("answer").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    document.getElementById("checkButton").click();
  }
});

buildAnswerKeys();
updateSettingsForTrainingType();
</script>

</body>
</html>
